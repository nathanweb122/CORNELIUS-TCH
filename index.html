
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cornelius TEC - Innovation That Defies Gravity</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@300;400;600;700&family=Orbitron:wght@400;500;600;700&family=Raleway:wght@300;400;600&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'neon-blue': '#00CFFF',
              'neon-purple': '#7A00FF',
              'neon-gold': '#FFD700',
              'dark-bg': '#050505',
              'card-bg': '#0D0D0F',
            },
            fontFamily: {
              heading: ['Orbitron', 'sans-serif'],
              subheading: ['Exo 2', 'sans-serif'],
              body: ['Roboto', 'sans-serif'],
              accent: ['Raleway', 'sans-serif'],
            },
            animation: {
              'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'float': 'float 6s ease-in-out infinite',
              'glimmer': 'glimmer 3s linear infinite',
              'glitch': 'glitch 1s linear infinite',
              'scan': 'scan 2s linear infinite',
            },
            keyframes: {
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-20px)' },
              },
              glimmer: {
                '0%': { opacity: '0.3' },
                '50%': { opacity: '0.8' },
                '100%': { opacity: '0.3' },
              },
              glitch: {
                '0%': { transform: 'translate(0)' },
                '20%': { transform: 'translate(-2px, 2px)' },
                '40%': { transform: 'translate(-2px, -2px)' },
                '60%': { transform: 'translate(2px, 2px)' },
                '80%': { transform: 'translate(2px, -2px)' },
                '100%': { transform: 'translate(0)' },
              },
              scan: {
                '0%': { top: '0%', opacity: '0' },
                '50%': { opacity: '1' },
                '100%': { top: '100%', opacity: '0' },
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #050505;
        color: #ffffff;
        margin: 0;
        overflow-x: hidden;
      }
      .glassmorphism {
        background: rgba(13, 13, 15, 0.6);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.05);
      }
      .neon-text {
        text-shadow: 0 0 10px rgba(0, 207, 255, 0.5), 0 0 20px rgba(0, 207, 255, 0.3);
      }
      .neon-glow-blue {
        box-shadow: 0 0 30px rgba(0, 207, 255, 0.2);
      }
      .kente-gradient {
        background: linear-gradient(90deg, #FFD700 0%, #7A00FF 50%, #00CFFF 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .african-pattern {
        background-image: url("data:image/svg+xml,%3Csvg width='80' height='80' viewBox='0 0 80 80' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%237A00FF' fill-opacity='0.05'%3E%3Cpath d='M40 40c0-11.046-8.954-20-20-20S0 28.954 0 40s8.954 20 20 20 20-8.954 20-20zm0 0c0 11.046 8.954 20 20 20s20-8.954 20-20-8.954-20-20-20-20 8.954-20 20z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
      }
      .neural-grid {
        background-image: linear-gradient(rgba(0, 207, 255, 0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 207, 255, 0.05) 1px, transparent 1px);
        background-size: 60px 60px;
      }
      .glitch-text:hover {
        animation: glitch 0.3s cubic-bezier(.25,.46,.45,.94) both infinite;
      }
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #050505;
      }
      ::-webkit-scrollbar-thumb {
        background: linear-gradient(#00CFFF, #7A00FF);
        border-radius: 20px;
      }
      @keyframes gradient-flow {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }
    </style>

{
  "imports": {

    "react": "https://esm.sh/react@^19.2.3",

    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",

  }
}
